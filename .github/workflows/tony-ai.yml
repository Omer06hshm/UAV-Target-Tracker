name: Tony AI Engineering Queue
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  issues: write
  contents: read
concurrency:
  group: tony-agent-queue
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tony_ai/requirements.txt
      - run: python tony_ai/tony_runner.py
